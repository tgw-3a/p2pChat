services:
  db:
    image: postgres:14
    volumes:
      - ../shared/db:/var/lib/postgresql/data
    environment:
      TZ: Asia/Tokyo
    env_file:
      - ../shared/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - net

  web:
    build:
      context: .
      dockerfile: Dockerfile_java
    volumes:
      - relay_data:/relay-artifacts:ro
    env_file:
      - ../shared/.env
    environment:
      RELAY_ENV_PATH: /relay-share/relay.env
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - net

  nginx:
    image: nginx:stable-alpine
    ports: []
    volumes:
      - ../shared/nginx/conf.d:/etc/nginx/conf.d:ro
    environment:
      TZ: Asia/Tokyo
    env_file:
      - ../shared/.env
    depends_on:
      web:
        condition: service_healthy
    networks:
      - net

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run
    restart: unless-stopped
    depends_on:
      - nginx
    env_file:
      - ../shared/.env
    networks:
      - net

  relay:
    build:
      context: .
      dockerfile: Dockerfile_relay
    volumes:
      - relay_data:/relay-artifacts
    environment:
      TZ: Asia/Tokyo
    healthcheck:
      test: ["CMD-SHELL", "test -f /relay-artifacts/static/js/bundle.js"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
    networks:
      - net

volumes:
  postgres-data:
  relay_data:

networks:
  net:
